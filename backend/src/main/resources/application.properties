spring.application.name=stockpilot
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockpilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Secret with 32+ byte default fallback so backend starts up reliably without required env vars
jwt.secret=${JWT_SECRET:stockpilot-secret-key-must-be-at-least-32-bytes-long-1234567890}

# Allowed registration emails (empty string allows any valid email)
app.allowed-emails=${TEAM_EMAILS:}

# Frontend CORS origin pattern (defaults to localhost:5173 but allows all local Vite/React origins)
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# AI / LLM Configuration
ai.url=${LLM_URL:https://api.openai.com/v1/chat/completions}
ai.model=${LLM_MODEL:gpt-4o-mini}
ai.key=${LLM_API_KEY:}
